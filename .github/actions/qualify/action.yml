name: Cross-platform qualification
description: Shared PR, main and release build, test, race, vet and installer gates
runs:
  using: composite
  steps:
    - name: Build
      shell: bash
      run: go build ./...
    - name: Unit, integration, and evaluation tests
      shell: bash
      run: go test -count=1 -timeout=20m ./...
    - name: Race detector
      if: runner.os != 'Windows'
      shell: bash
      run: go test -race -count=1 -timeout=30m ./...
    - name: Race detector (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: go test -race -p=1 -count=1 -timeout=30m ./...
    - name: Static analysis
      shell: bash
      run: go vet ./...
    - name: Test shell installer
      if: runner.os != 'Windows'
      shell: bash
      run: scripts/test-install.sh
    - name: Test PowerShell installer
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./scripts/test-install.ps1
