name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - run: go build ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...

  release-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - run: chmod +x scripts/build-release.sh
      - run: scripts/build-release.sh
        env:
          COLLO_VERSION: ci
      - uses: actions/upload-artifact@v4
        with:
          name: collo-binaries
          path: dist/
