name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Build
        run: go build ./...
      - name: Cross-platform unit, integration, and evaluation tests
        run: go test -count=1 ./...
      - name: Race detector
        run: go test -race -count=1 ./...
      - name: Static analysis
        run: go vet ./...

  release-builds:
    needs: [test, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - run: chmod +x scripts/build-release.sh
      - run: scripts/build-release.sh
        env:
          COLLO_VERSION: ci
      - uses: actions/upload-artifact@v4
        with:
          name: collo-binaries
          path: dist/

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Deterministic offline agent evaluations
        run: go test -count=1 ./internal/eval
      - name: Replay parser fuzz smoke test
        run: go test ./internal/replay -run '^$' -fuzz '^FuzzRead$' -fuzztime 3s
      - name: Configuration validation fuzz smoke test
        run: go test ./internal/config -run '^$' -fuzz '^FuzzConfigValidation$' -fuzztime 3s
      - name: Shell analysis fuzz smoke test
        run: go test ./internal/shell -run '^$' -fuzz '^FuzzAnalyze$' -fuzztime 3s
      - name: Diff parser fuzz smoke test
        run: go test ./internal/diffmodel -run '^$' -fuzz '^FuzzDiffAndHunkParsing$' -fuzztime 3s
