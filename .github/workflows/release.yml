name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Unit, integration, and evaluation tests
        run: go test -count=1 ./...
      - name: Race detector
        run: go test -race -count=1 ./...
      - name: Static analysis
        run: go vet ./...
      - name: Test shell installer
        if: runner.os != 'Windows'
        run: scripts/test-install.sh
      - name: Test PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install.ps1

  quality:
    name: Security and deterministic quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify downloaded modules
        run: go mod verify
      - name: Scan reachable Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Deterministic offline agent evaluations
        run: go test -count=1 ./internal/eval
      - name: Interruption and cancellation stress
        run: >-
          go test -count=5
          -run '^(TestSessionAbruptProcessDeathLeavesRecoverableInterruptedTool|TestAtomicReplacementSurvivesAbruptProcessDeath|TestPersistenceFailure.*|TestTeamCancellationRaceCannotReviveTask|TestRuntimeCloseWaitsForBackgroundProcesses|TestExclusiveDurableBlobFailuresRemovePartialFile|TestStopAllKillsEverything)$'
          ./internal/session ./internal/safefile ./internal/agent ./internal/app ./internal/tools
      - name: Performance baseline smoke
        run: >-
          go test -run '^$'
          -bench '^(BenchmarkRuntimeStartup|BenchmarkProjectLargeSession|BenchmarkIndexLargeWorkspaceQuery|BenchmarkIndexWarmRefresh|BenchmarkLoadLongSession|BenchmarkActivityView500Items|BenchmarkChatViewLongTranscript)$'
          -benchtime=1x -benchmem
          ./internal/app ./internal/activity ./internal/index ./internal/session ./internal/tui
      - name: Replay parser fuzz smoke test
        run: go test ./internal/replay -run '^$' -fuzz '^FuzzRead$' -fuzztime 3s
      - name: Configuration validation fuzz smoke test
        run: go test ./internal/config -run '^$' -fuzz '^FuzzConfigValidation$' -fuzztime 3s
      - name: Shell analysis fuzz smoke test
        run: go test ./internal/shell -run '^$' -fuzz '^FuzzAnalyze$' -fuzztime 3s
      - name: Diff parser fuzz smoke test
        run: go test ./internal/diffmodel -run '^$' -fuzz '^FuzzDiffAndHunkParsing$' -fuzztime 3s

  build-release:
    name: Build release assets
    needs: [qualify, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify tag, VERSION, and release ancestry
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          [[ "$GITHUB_REF_TYPE" == tag ]]
          [[ "$GITHUB_REF_NAME" == "$version" ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Build all release targets
        shell: bash
        env:
          COLLO_VERSION: ${{ github.ref_name }}
          COLLO_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          export COLLO_BUILD_DATE="$(git show -s --format=%cI "$GITHUB_SHA")"
          scripts/build-release.sh --skip-tests --clean
      - name: Generate deterministic CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
          "$(go env GOPATH)/bin/cyclonedx-gomod" mod \
            -json \
            -noserial \
            -notimestamp \
            -output dist/collomia.cdx.json \
            .
          serial_seed="$(printf '%s' "$GITHUB_REPOSITORY:$GITHUB_SHA" | sha256sum | cut -d' ' -f1)"
          serial_uuid="${serial_seed:0:8}-${serial_seed:8:4}-8${serial_seed:13:3}-8${serial_seed:17:3}-${serial_seed:20:12}"
          jq --arg serial "urn:uuid:$serial_uuid" \
            '.serialNumber = $serial' \
            dist/collomia.cdx.json > dist/collomia.cdx.json.tmp
          mv dist/collomia.cdx.json.tmp dist/collomia.cdx.json
          jq -e '
            .bomFormat == "CycloneDX" and
            (.specVersion | type == "string") and
            (.serialNumber | test("^urn:uuid:[0-9a-f]{8}-[0-9a-f]{4}-8[0-9a-f]{3}-8[0-9a-f]{3}-[0-9a-f]{12}$"))
          ' dist/collomia.cdx.json >/dev/null
      - name: Checksum and inspect release assets
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum collo-* collomia.cdx.json > checksums.txt
          sha256sum --check checksums.txt
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 8
      - name: Upload release assets for native smoke tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Smoke release artifact on ${{ matrix.os }}
    needs: build-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Run Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux) os=linux ;;
            macOS) os=darwin ;;
            *) exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) arch=amd64 ;;
            arm64|aarch64) arch=arm64 ;;
            *) exit 1 ;;
          esac
          asset="dist/collo-$os-$arch"
          chmod 0755 "$asset"
          identity="$($asset --version)"
          [[ "$identity" == "collo $GITHUB_REF_NAME ("* ]]
          [[ "$identity" == *"$GITHUB_SHA"* ]]
      - name: Run Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          $asset = switch ($arch) {
            'X64' { 'dist\collo-windows-amd64.exe' }
            'Arm64' { 'dist\collo-windows-arm64.exe' }
            default { throw "Unsupported runner architecture: $arch" }
          }
          $identity = & $asset --version
          if (-not $identity.StartsWith("collo $env:GITHUB_REF_NAME (")) {
            throw "Unexpected release identity: $identity"
          }
          if (-not $identity.Contains($env:GITHUB_SHA)) {
            throw "Release identity does not contain $env:GITHUB_SHA`: $identity"
          }

  attest-release:
    name: Attest qualified release assets
    needs: [build-release, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download qualified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check checksums.txt
      - name: Attest release provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: dist/checksums.txt
      - name: Attest binary SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/collo-*
          sbom-path: dist/collomia.cdx.json

  draft-release:
    name: Create draft release
    needs: attest-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download qualified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Verify checksums again
        working-directory: dist
        run: sha256sum --check checksums.txt
      - name: Create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --draft \
            "${prerelease[@]}" \
            --generate-notes \
            --title "Collomia $GITHUB_REF_NAME"
